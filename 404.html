<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Alessio Paradisi</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    /* GitHub Pages serves this for any missing URL. Absolute paths, since it can be served from any depth. */
    :root { --bg: #f7f5f0; --ink: #16202c; --ink-2: #4a5563; --ink-3: #7b8592; --accent: #0d2b4e; --accent-2: #c2410c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 24px; color: var(--ink);
      font: 400 17px/1.6 "IBM Plex Sans", system-ui, sans-serif;
      background:
        radial-gradient(60rem 42rem at 92% 8%, rgba(13, 43, 78, .11), transparent 62%),
        radial-gradient(52rem 40rem at -8% 72%, rgba(194, 65, 12, .09), transparent 60%),
        var(--bg);
    }
    main {
      max-width: 520px; padding: 40px 36px; border-radius: 18px; text-align: left;
      background: rgba(255, 253, 249, .55); border: 1px solid rgba(255, 255, 255, .8);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 40px rgba(20, 30, 45, .07);
    }
    .code { font: 400 .78rem/1 "IBM Plex Mono", monospace; letter-spacing: .1em; color: var(--accent-2); text-transform: uppercase; margin: 0 0 14px; }
    h1 { font: 400 2.4rem/1.1 "Newsreader", Georgia, serif; margin: 0 0 14px; letter-spacing: -.01em; }
    p { color: var(--ink-2); margin: 0 0 22px; }
    a.home {
      display: inline-block; text-decoration: none; color: #fff; background: var(--accent);
      font: 500 .9rem/1 "IBM Plex Sans", sans-serif; padding: 11px 18px; border-radius: 999px;
    }
    a.home:hover { background: var(--accent-2); }
    a:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404 · state not found</p>
    <h1>This page has decayed.</h1>
    <p>Whatever was here has a lifetime shorter than your link. The projects and results are still on the main page.</p>
    <a class="home" href="/">Back to the main page</a>
  </main>
</body>
</html>
